<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>智源AI 客服工作台 V2</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#6750d8" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <b>zhiyaunkefu · 客服后台</b><span>知识库 / 话术 / 售后 / 培训</span>
        </div>
        <button class="navbtn on" data-mode="home" onclick="showHome()">
          🏠 首页</button
        ><button class="navbtn" data-mode="fav" onclick="showFavs()">
          ⭐ 收藏 <em id="favCount">0</em></button
        ><button class="navbtn" data-mode="recent" onclick="showRecent()">
          🕘 最近使用
        </button>
        <div class="navtitle">知识分类</div>
        <div id="cats"></div>
        <div class="sideactions">
          <button onclick="addGroup()">＋分类</button
          ><button onclick="exportData()">导出</button
          ><button onclick="importData()">导入</button
          ><button onclick="resetData()">恢复</button>
        </div>
      </aside>
      <section class="middle">
        <div class="searchbox">
          <input id="q" placeholder="全局搜索标题或正文…" />
        </div>
        <div class="listhead">
          <b id="listTitle">首页</b
          ><button class="pill" id="addBtn" onclick="addItem()">＋新增</button>
        </div>
        <div id="items"></div>
      </section>
      <main class="main"><div id="main"></div></main>
    </div>
    <div class="toast" id="toast"></div>
    <script src="data/data.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/search.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
