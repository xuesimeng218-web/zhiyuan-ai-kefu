<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>智源客服知识库</title>
    <link rel="stylesheet" href="css/style.css?v=20260801-2" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#6750d8" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand">
            <b>智源客服知识库</b><span>知识库 / 话术 / 售后 / 培训</span>
          </div>
          <button class="navbtn on" data-mode="home" onclick="showHome()">
            🏠 首页</button
          ><button class="navbtn" data-mode="fav" onclick="showFavs()">
            ⭐ 收藏 <em id="favCount">0</em></button
          ><button class="navbtn" data-mode="recent" onclick="showRecent()">
            🕘 最近使用
          </button>
        </div>
        <section class="category-section" aria-label="知识分类">
          <button
            type="button"
            class="category-scroll-button category-scroll-up"
            aria-label="向上滚动知识分类"
            title="向上滚动"
            onclick="scrollCategoryList(-1)"
          >
            ↑
          </button>
          <div class="category-scroll" id="categoryScroll">
            <div class="navtitle">知识分类</div>
            <div id="cats"></div>
          </div>
          <button
            type="button"
            class="category-scroll-button category-scroll-down"
            aria-label="向下滚动知识分类"
            title="向下滚动"
            onclick="scrollCategoryList(1)"
          >
            ↓
          </button>
        </section>
        <div class="sideactions">
          <button onclick="addGroup()">＋分类</button
          ><button onclick="exportData()">导出</button
          ><button onclick="importData()">导入</button
          ><button onclick="resetData()">恢复</button>
        </div>
      </aside>
      <section class="middle">
        <div class="searchbox">
          <input id="q" placeholder="全局搜索标题或正文…" />
        </div>
        <div class="listhead">
          <b id="listTitle">首页</b
          ><button class="pill" id="addBtn" onclick="addItem()">＋新增</button>
        </div>
        <div id="items"></div>
      </section>
      <main class="main"><div id="main"></div></main>
    </div>
    <div class="toast" id="toast"></div>
    <script src="data/presale.js"></script>
    <script src="data/aftersale-onhold.js"></script>
    <script src="data/aftersale-actions.js"></script>
    <script src="data/other.js"></script>
    <script src="data/products.js"></script>
    <script src="data/tutorials.js"></script>
    <script src="data/training.js"></script>
    <script src="data/document-pack.js"></script>
    <script src="data/data.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/search.js?v=20260801-3"></script>
    <script src="js/script.js?v=20260801-3"></script>
  </body>

</html>
